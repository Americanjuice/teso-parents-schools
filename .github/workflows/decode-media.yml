name: Decode uploaded media
on:
  push:
    branches: [main]
    paths: ['_incoming/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode-media
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode base64 files
        run: |
          shopt -s nullglob
          for f in _incoming/*.b64; do
            name=$(basename "$f" .b64)
            target="${name//__//}"
            mkdir -p "$(dirname "$target")"
            base64 -d "$f" > "$target"
            git rm -q "$f"
            git add "$target"
            echo "decoded $target"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Decode uploaded media"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
